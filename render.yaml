# Render Blueprint — SaloonOS on Render's FREE web services + Supabase Postgres.
#   Render dashboard → New → Blueprint → pick the repo
#
# No credit card needed: the database is NOT provisioned here (that's the paid
# piece). Create a free Postgres on supabase.com first, then paste its
# connection string when the blueprint asks for DATABASE_URL.
#
# Creates:
#   saloonos-api — Django under gunicorn (migrate + collectstatic on every deploy)
#   saloonos-web — Next.js, proxying /api/* to the API service (one origin, no CORS)
#
# After the first deploy (optional demo data): API service → Shell → python seed_demo.py

services:
  - type: web
    name: saloonos-api
    runtime: python
    rootDir: .
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py seed_plans
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 30
    healthCheckPath: /api/plans
    envVars:
      - key: DATABASE_URL
        sync: false           # paste your Supabase "Session pooler" connection string
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # QR codes point here — replace <name> after first deploy if you rename,
      # or set your own domain.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Configure these with the live Safaricom merchant credentials in Render.
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_TILL_NUMBER
        value: "4567052"
      - key: MPESA_TRANSACTION_TYPE
        value: "CustomerBuyGoodsOnline"
      - key: MPESA_ENVIRONMENT
        value: "production"
      - key: MPESA_SIMULATE
        value: "0"

  - type: web
    name: saloonos-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Next.js proxies /api/* to the Django service — one origin, no CORS.
      - key: API_ORIGIN
        fromService:
          name: saloonos-api
          type: web
          property: hostport
      - key: NODE_VERSION
        value: "22.14.0"
